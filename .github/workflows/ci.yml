name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: Lint & import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q bot.py config.py claude_client.py
      - name: Import / wiring smoke test
        env:
          TELEGRAM_BOT_TOKEN: "123:DUMMY"
          ANTHROPIC_API_KEY: "sk-ant-dummy"
        run: |
          python - <<'PY'
          import bot
          app = bot.build_application()
          names = [type(h).__name__ for h in app.handlers[0]]
          assert "InlineQueryHandler" in names, names
          assert "ChosenInlineResultHandler" in names, names
          print("wiring OK:", names)
          PY

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: check
    # Only publish on direct pushes (not PRs from forks, which lack package perms).
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
